CONFIG_GPIO=y
# No SPI / display driver: nothing else must claim the candidate pins
CONFIG_SPI=n
CONFIG_DISPLAY=n
# P0.09 / P0.10 are NFC antenna pins unless UICR.NFCPINS says otherwise
CONFIG_NFCT_PINS_AS_GPIOS=y
CONFIG_PRINTK=y
CONFIG_CONSOLE=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_UART_CONSOLE=n

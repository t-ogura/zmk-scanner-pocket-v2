# Start a SEGGER RTT console over the SWD link and serve channel 0 on TCP 9090.
# Kept in a file because PowerShell mangles the quoted "SEGGER RTT" id on the
# command line. Usage:
#   openocd -f interface/cmsis-dap.cfg -f target/nordic/nrf52.cfg -f rtt.cfg \
#           -c "adapter speed 500" -c "init" -c "rtt_go"
proc rtt_go {} {
	rtt setup 0x20000000 65536 "SEGGER RTT"
	rtt start
	rtt server start 9090 0
	echo "*** RTT channel 0 on tcp://localhost:9090 - connect with telnet/PuTTY (raw) ***"
}

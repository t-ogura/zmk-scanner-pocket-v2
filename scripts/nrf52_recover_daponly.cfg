# nRF52 APPROTECT recovery through the CTRL-AP with NO cortex_m target defined.
#
# The stock target/nrf52.cfg creates a cortex_m target whose examination
# fails on a locked chip; nrf52_recover then runs on top of that failed
# state. This file skips the target entirely: only the SW-DP and the DAP
# exist, so nothing but our CTRL-AP register writes touches the chip.
#
# Usage (do NOT also load target/nordic/nrf52.cfg):
#   openocd -f interface/cmsis-dap.cfg -f nrf52_recover_daponly.cfg \
#           -c "adapter speed 500" -c "init" -c "recover_daponly" -c "exit"

transport select swd
source [find target/swj-dp.tcl]
swj_newdap nrf52 cpu -expected-id 0x2ba01477
dap create nrf52.dap -chain-position nrf52.cpu

proc recover_daponly {} {
	set dap nrf52.dap

	set IDR [$dap apreg 1 0xfc]
	echo [format "CTRL-AP IDR          = 0x%08x (expect 0x02880000)" $IDR]
	if {$IDR != 0x02880000} {
		echo "Error: Cannot access nRF52 CTRL-AP!"
		return
	}
	echo [format "APPROTECTSTATUS      = %d  (0 = locked, 1 = unlocked)" [$dap apreg 1 0x0c]]
	echo [format "ERASEALLSTATUS       = %d  (before)" [$dap apreg 1 0x08]]
	echo [format "ERASEALL register    = %d  (before)" [$dap apreg 1 0x04]]

	# Make sure no stale task is pending, then trigger
	$dap apreg 1 0x04 0
	sleep 10
	$dap apreg 1 0x04 1

	set done 0
	for {set i 0} {$i < 600} {incr i} {
		set st [$dap apreg 1 0x08]
		if {$i % 10 == 0} {
			echo [format "  t=%5d ms  ERASEALLSTATUS=%d  ERASEALL=%d" [expr {$i * 100}] $st [$dap apreg 1 0x04]]
		}
		if {$st == 0} { set done 1; break }
		sleep 100
	}

	# Clear the task, then CTRL-AP soft reset pulse
	$dap apreg 1 0x04 0
	$dap apreg 1 0x00 1
	sleep 50
	$dap apreg 1 0x00 0
	sleep 100

	echo [format "APPROTECTSTATUS      = %d  (after; 1 means unlocked)" [$dap apreg 1 0x0c]]
	if {$done} {
		echo "*** ERASEALL completed. Power-cycle the target, then run init; reset halt with target/nordic/nrf52.cfg."
	} else {
		echo "*** ERASEALL never reported done."
	}
}

manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: prospector
      url-base: https://github.com/t-ogura

  projects:
    # Pinned to the ZMK commit verified against this board definition
    # (Hardware Model v2, Zephyr 4.1.0+zmk-fixes, nRF52832 QFAA SoC
    # support present). Bump deliberately, rebuild, then update this note.
    - name: zmk
      remote: zmkfirmware
      revision: 354cff9c36b49eee6abbb8a61e6b927539aebbf2
      import: app/west.yml

    # Scanner core, the Scanner Pocket UI shield and the CR2032 battery driver
    - name: prospector-zmk-module
      remote: prospector
      revision: feature/scanner-pocket-v2.3
      path: modules/prospector-zmk-module

  self:
    path: config

# Scanner Pocket v2 - ZMK user configuration
#
# The board definition under config/boards/ is kept pure Zephyr so that plain
# Zephyr samples (app/phase_a_blink) build against it. Everything ZMK-flavoured
# therefore lives here.

CONFIG_ZMK_KEYBOARD_NAME="Scanner Pocket"   # 16 chars max for the BLE name
CONFIG_ZMK_BLE=y

# Settings persistence in the storage partition (bonds, keymap state)
CONFIG_NVS=y
CONFIG_SETTINGS_NVS=y

# nRF52832: 64 KiB RAM, no USB. Keep the image small; ZMK Studio stays off.

# Nothing is wired to a UART. For debugging use RTT over the SWD link:
#   CONFIG_ZMK_RTT_LOGGING=y
# and read it with OpenOCD's `rtt` commands (see docs/).
CONFIG_LOG=n

# Deep sleep interferes with early bring-up; revisit once BLE/LCD are proven.
CONFIG_ZMK_SLEEP=n

# ===== Display: Sharp LS013B7DH05 via Zephyr ls0xx, ZMK built-in status screen =====
# First integrated build (BLE + lever + LCD together). Purpose: measure RAM on
# the 64 KiB part before any custom UI. Same 1-bpp LVGL setup the v1 shield used.
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=y

CONFIG_LV_Z_BITS_PER_PIXEL=1
CONFIG_LV_COLOR_DEPTH_1=y
# Partial rendering: a 25% buffer (42 lines) rendered in full-width bands.
# ls0xx only accepts full-width line writes, so X alignment is pinned to the
# panel width. Verified on the panel 2026-10-08: identical to a full-frame
# VDB, and 8.7 KiB cheaper (RAM 53,620 B vs 62,324 B).
CONFIG_LV_Z_VDB_SIZE=25
CONFIG_LV_Z_DOUBLE_VDB=n
CONFIG_LV_Z_FULL_REFRESH=n
CONFIG_LV_Z_AREA_X_ALIGNMENT_WIDTH=144
# ZMK's default for the built-in screen; enough on the panel.
CONFIG_LV_Z_MEM_POOL_SIZE=4096

# Memory LCD draws microwatts while static - never blank it
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=n
# Keep UI work off the system queue (v1 did the same)
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=3072

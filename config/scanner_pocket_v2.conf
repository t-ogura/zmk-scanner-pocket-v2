# Scanner Pocket v2 - ZMK user configuration
#
# The board definition under config/boards/ is kept pure Zephyr so that plain
# Zephyr samples (app/phase_a_blink) build against it. Everything ZMK-flavoured
# therefore lives here.

CONFIG_ZMK_KEYBOARD_NAME="Scanner Pocket"   # 16 chars max; used as the BT device name

# Observer only. The device is a Prospector scanner, not a keyboard: no BLE
# peripheral/HID role, no pairing. The host stack, BT_OBSERVER and
# PROSPECTOR_MODE_SCANNER come from the scanner_pocket_v2 shield defaults.
# Measured 2026-10-08: keeping the keyboard role alongside the scanner and
# the Pocket UI overflows the 64 KiB RAM by ~5 KiB; observer-only is 44 KiB.
CONFIG_ZMK_BLE=n
CONFIG_PROSPECTOR_MAX_KEYBOARDS=3

# Settings persistence in the storage partition (bonds, keymap state)
CONFIG_NVS=y
CONFIG_SETTINGS_NVS=y

# nRF52832: 64 KiB RAM, no USB. Keep the image small; ZMK Studio stays off.

# Nothing is wired to a UART. For debugging use RTT over the SWD link:
#   CONFIG_ZMK_RTT_LOGGING=y
# and read it with OpenOCD's `rtt` commands (see docs/).
CONFIG_LOG=n

# Deep sleep interferes with early bring-up; revisit once BLE/LCD are proven.
CONFIG_ZMK_SLEEP=n

# ===== Display: Sharp LS013B7DH05 via Zephyr ls0xx, Scanner Pocket UI =====
# The screen is pocket_display.c from the prospector module (custom status
# screen, selected by the scanner_pocket_v2 shield). 1-bpp LVGL as on v1.
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

CONFIG_LV_Z_BITS_PER_PIXEL=1
CONFIG_LV_COLOR_DEPTH_1=y
# Partial rendering with a 25% buffer. The rotated driver keeps its own
# full frame and accepts any update rectangle, so no X alignment is needed
# (144 was right for the stock driver's full-width lines and WRONG for the
# rotated driver's 168-px logical width - it overran the render buffer).
CONFIG_LV_Z_VDB_SIZE=25
CONFIG_LV_Z_DOUBLE_VDB=n
CONFIG_LV_Z_FULL_REFRESH=n
CONFIG_LV_Z_AREA_X_ALIGNMENT_WIDTH=1
# The Pocket UI (layer slide, 4 battery slots, animations) needs more than
# ZMK's 4 KiB default; 8 KiB corrupted the heap, 16 KiB runs.
CONFIG_LV_Z_MEM_POOL_SIZE=16384

# Memory LCD draws microwatts while static - never blank it
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=n
# Keep UI work off the system queue (v1 did the same)
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=3072

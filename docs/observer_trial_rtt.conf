# Direction A + RTT logging (diagnostic). Pool and log buffers trimmed to fit.
CONFIG_ZMK_BLE=n
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=n
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_PROSPECTOR_MAX_KEYBOARDS=3
CONFIG_LV_Z_MEM_POOL_SIZE=12288
CONFIG_LOG=y
CONFIG_ZMK_RTT_LOGGING=y
CONFIG_LOG_BUFFER_SIZE=1024
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=512
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_ZMK_LOG_LEVEL_INF=y
CONFIG_THREAD_NAME=y
